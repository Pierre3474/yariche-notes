[package]
name = "yariche"
version = "1.0.1"
description = "Yariche: notes Markdown collaboratives"
authors = ["Yariche contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "yariche_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-opener = "2.5"
tauri-plugin-deep-link = "2.4"
tauri-plugin-single-instance = { version = "2.4", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"
url = "2"
dirs = "7"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
