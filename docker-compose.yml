services:
  yariche:
    build: .
    image: yariche:latest
    container_name: yariche
    restart: unless-stopped
    ports:
      - "${YARICHE_PORT:-5174}:5174"
    # Toute la configuration est dans .env (voir .env.example)
    env_file:
      - .env
    volumes:
      # Sessions, réglages et coffres (vaults/<nom>/…) : à sauvegarder
      - ./data:/app/data
    # --- Durcissement ------------------------------------------------------------------
    # Système de fichiers en lecture seule (seuls data/ et /tmp sont inscriptibles)
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    # Aucune élévation de privilèges (setuid, capacités de fichiers…)
    security_opt:
      - no-new-privileges:true
    # Aucune capacité Linux, sauf celles qu'il faut au démarrage pour rendre data/ au
    # compte « node » : l'entrypoint les abandonne toutes (y compris l'ensemble limite)
    # avant de lancer Yariche sous « node »
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - SETPCAP
    # Ressources bornées
    pids_limit: 256
    mem_limit: 1g
